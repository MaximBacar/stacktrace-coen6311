<!DOCTYPE html>
<html>
<head>
    <title>Gym Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f4f8; color: #333; }
        .container { 
            max-width: 1000px; margin: auto; background: white; 
            padding: 30px; border-radius: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
        }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        /* Stats Cards Styling - Criterion 2 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #f8f9fa; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #e9ecef; }
        .stat-label { font-size: 14px; color: #6c757d; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #2c3e50; margin-top: 5px; }

        /* Chart constraints - Fix for stretched layout */
        .chart-wrapper { position: relative; height: 400px; width: 100%; margin-bottom: 20px; }
        
        /* Filter Form - Criterion 3 */
        .filter-form { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; background: #f1f3f5; padding: 15px; border-radius: 10px; }
        select, input[type="date"] { padding: 8px 12px; border-radius: 5px; border: 1px solid #ced4da; outline: none; }

        /* Legend - Criterion 1 */
        .legend-container { display: flex; justify-content: center; gap: 20px; margin-top: 10px; padding: 10px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .color-box { width: 16px; height: 16px; border-radius: 4px; }

        /* Export Button - Criterion 5 */
        .btn-export { background: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-export:hover { background: #34495e; }

        @media print { .btn-export, .filter-form { display: none; } .container { box-shadow: none; border: none; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h1>Gym Peak Hours</h1>
            <button class="btn-export" onclick="window.print()">Download Report (PDF)</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Avg. Booking Rate</div>
                <div class="stat-value" id="avgRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Peak Occupancy</div>
                <div class="stat-value" id="maxRate">0%</div>
            </div>
        </div>

        <form class="filter-form" method="GET">
            <div>
                <label>Date: </label>
                <input type="date" name="date" value="{{ selected_date }}" onchange="this.form.submit()">
            </div>
            <div>
                <label>Membership: </label>
                <select name="membership_type" onchange="this.form.submit()">
                    <option value="">All Types</option>
                    <option value="student" {% if membership_filter == 'student' %}selected{% endif %}>Student</option>
                    <option value="staff" {% if membership_filter == 'staff' %}selected{% endif %}>Staff</option>
                </select>
            </div>
        </form>

        <div class="chart-wrapper">
            <canvas id="peakHoursChart"></canvas>
        </div>

        <div class="legend-container">
            <div class="legend-item"><div class="color-box" style="background:rgba(46, 204, 113, 0.8);"></div> Low</div>
            <div class="legend-item"><div class="color-box" style="background:rgba(241, 196, 15, 0.8);"></div> Moderate</div>
            <div class="legend-item"><div class="color-box" style="background:rgba(231, 76, 60, 0.8);"></div> Peak</div>
        </div>
    </div>

    <script>
        const rawData = {{ count_data|safe }};
        const percentages = {{ percentage_data|safe }};
        const labels = {{ labels|safe }};

        // Update Stat Cards - Calculate logic
        const activePercentages = percentages.filter(p => p > 0);
        const avg = activePercentages.length > 0 
            ? (activePercentages.reduce((a, b) => a + b, 0) / activePercentages.length).toFixed(1) 
            : 0;
        const max = Math.max(...percentages);

        document.getElementById('avgRate').innerText = avg + '%';
        document.getElementById('maxRate').innerText = max + '%';

        // Chart.js Configuration
        const ctx = document.getElementById('peakHoursChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Bookings',
                    data: rawData,
                    backgroundColor: rawData.map(c => {
                        if (c > 2) return 'rgba(231, 76, 60, 0.8)'; // Red
                        if (c > 1) return 'rgba(241, 196, 15, 0.8)'; // Yellow
                        return 'rgba(46, 204, 113, 0.8)'; // Green
                    }),
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 }, title: { display: true, text: 'Total Bookings' } },
                    x: { title: { display: true, text: 'Hour of Day (24h)' } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            afterLabel: function(context) {
                                return 'Occupancy: ' + percentages[context.dataIndex] + '%';
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
